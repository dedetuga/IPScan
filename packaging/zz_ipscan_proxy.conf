# IP Scan: reverse-proxy the control endpoint to the app's Unix socket using
# standard mod_proxy_http (same approach as SSH Jump legacy). The Axis classic
# path (mod_trax + TransferMethodProxy) uses a proprietary fd-passing IPC in
# which mod_trax binds the socket itself; a Go daemon can't speak that, and our
# listener collides with it (errno 98 EADDRINUSE). mod_proxy_http instead simply
# CONNECTS to our socket.
#
# Worker URL: mod_proxy keys its workers on the URL after the "|", NOT on the
# unix: socket. Two apps that both use "http://localhost/..." share ONE worker
# and Apache sends both apps' control.cgi to whichever socket won (seen with
# SSH Jump + IP Scan on ARTPEC-5). Every app must use its own host here; the
# Host header is cosmetic (the daemon routes on ?op=).
#
# timeout: an export of a large scan can take a few seconds.
ProxyPass        /local/ipscan/control.cgi  "unix:/var/run/http/ipscan/http|http://ipscan.acap/control.cgi" timeout=60
ProxyPassReverse /local/ipscan/control.cgi  "unix:/var/run/http/ipscan/http|http://ipscan.acap/control.cgi"
<Location "/local/ipscan/control.cgi">
    Require axis-group admin
</Location>
